version: '1'
services:
  bot:
    build: .
    env_file:
      - ".env"
    networks: 
      - app-network
    depends_on:
      - pg
      - redis

  pg:
    image: postgres:13.3
    env_file:
      - ".env"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: 
      - app-network

  redis:
    image: redis
    ports:
      - "6379:6379"
    networks: 
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
