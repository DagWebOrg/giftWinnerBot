version: '1'
services:
  bot:
    build: .
    env_file:
      - ".env"
    network: 
      - app-network

  pg:
    image: postgres:13.3
    env_file:
      - ".env"
    ports:
      - "5432:5432"
    network: 
      - app-network

  redis:
    image: redis
    ports:
      - "6379:6379"
    network: 
      - app-network

networks:
  app-network:
    driver: bridge